<svg xmlns='http://www.w3.org/2000/svg' width='860' height='416' viewBox='0 0 860 416' role='img'><title>GPU memory by context and KV cache</title><style>text{font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.f-bg{fill:#ffffff}.s-bg{stroke:#ffffff}.f-ink{fill:#1f2328}.s-ink{stroke:#1f2328}.f-muted{fill:#656d76}.s-muted{stroke:#656d76}.f-grid{fill:#eaeef2}.s-grid{stroke:#eaeef2}.f-axis{fill:#afb8c1}.s-axis{stroke:#afb8c1}.f-white{fill:#ffffff}.s-white{stroke:#ffffff}.f-base{fill:#8c959f}.s-base{stroke:#8c959f}.f-yarn{fill:#0e7c86}.s-yarn{stroke:#0e7c86}.f-ours{fill:#1a7f37}.s-ours{stroke:#1a7f37}.f-rec{fill:#bf8700}.s-rec{stroke:#bf8700}.f-h5{fill:#1a7f37}.s-h5{stroke:#1a7f37}.f-h4{fill:#9bd5a9}.s-h4{stroke:#9bd5a9}.f-h3{fill:#f2d27a}.s-h3{stroke:#f2d27a}.f-h2{fill:#f3ac7a}.s-h2{stroke:#f3ac7a}.f-h1{fill:#f2a6a0}.s-h1{stroke:#f2a6a0}.f-h0{fill:#cf222e}.s-h0{stroke:#cf222e}@media (prefers-color-scheme:dark){.f-bg{fill:#0d1117}.s-bg{stroke:#0d1117}.f-ink{fill:#e6edf3}.s-ink{stroke:#e6edf3}.f-muted{fill:#8d96a0}.s-muted{stroke:#8d96a0}.f-grid{fill:#21262d}.s-grid{stroke:#21262d}.f-axis{fill:#484f58}.s-axis{stroke:#484f58}.f-white{fill:#ffffff}.s-white{stroke:#ffffff}.f-base{fill:#6e7681}.s-base{stroke:#6e7681}.f-yarn{fill:#2bb3c0}.s-yarn{stroke:#2bb3c0}.f-ours{fill:#3fb950}.s-ours{stroke:#3fb950}.f-rec{fill:#d29922}.s-rec{stroke:#d29922}.f-h5{fill:#238636}.s-h5{stroke:#238636}.f-h4{fill:#1f5f30}.s-h4{stroke:#1f5f30}.f-h3{fill:#6b5110}.s-h3{stroke:#6b5110}.f-h2{fill:#7c3b12}.s-h2{stroke:#7c3b12}.f-h1{fill:#6e211d}.s-h1{stroke:#6e211d}.f-h0{fill:#b62324}.s-h0{stroke:#b62324}}</style><rect x='0.5' y='0.5' width='859' height='415' rx='12' class='f-bg s-grid'/><text x='24.0' y='36.0' font-size='19' text-anchor='start' class='f-ink' font-weight='bold'>Long context on a 16 GB card: the KV cache decides</text><text x='24.0' y='58.0' font-size='12.5' text-anchor='start' class='f-muted' font-weight='normal'>ALLaM-7B, 4-bit weights (Q4_K_M), llama.cpp