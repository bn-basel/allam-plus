[project]
name = "allam-plus"
version = "0.1.0"
description = "ALLaM-7B-Instruct with 16K context and Arabic tool calling, measured before and after"
requires-python = "==3.12.*"
dependencies = [
    "absl-py>=2.5.0",
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "datasets>=5.0.1",
    "immutabledict>=4.3.1",
    "langdetect>=1.0.9",
    "nltk>=3.10.3",
    "openai>=3.22.1",
    "peft>=0.21.0",
    "protobuf>=7.36.2",
    "sentencepiece>=0.2.2",
    "torch==2.12.1",
    "transformers>=5.17.0",
    "trl>=1.14.0",
]

[tool.uv]
# Resolve the lockfile for the two places this project runs:
# Windows now (RTX 5080), Linux later (cloud GPUs).
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

# PyTorch's own package index for CUDA 13.0 builds. The torch on PyPI for Windows is CPU-only.
# explicit = true: only packages listed under [tool.uv.sources] come from here.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
